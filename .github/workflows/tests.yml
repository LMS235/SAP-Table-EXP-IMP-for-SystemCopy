name: tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: Unix (bash, dialog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -x -S style sap_tab_exp_imp.sh script/*.sh tests/unix/run_tests.sh tests/unix/fake/dialog tests/unix/fake/R3trans
      - name: install dialog
        run: sudo apt-get update && sudo apt-get install -y dialog
      - name: tests
        run: bash tests/unix/run_tests.sh

  windows:
    name: Windows (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: tests
        shell: powershell
        run: .\tests\windows\run_tests.ps1
